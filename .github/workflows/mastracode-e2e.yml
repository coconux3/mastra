name: Mastra Code E2E

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

permissions: {}

jobs:
  mastracode-e2e:
    name: Mastra Code E2E
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: $/.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build Mastra Code
        id: build
        run: pnpm run build:mastracode

      - name: Typecheck Code SDK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @mastra/code-sdk check

      - name: Run ACP unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @mastra/code-sdk test:acp

      - name: Check built SDK ACP conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @mastra/code-sdk test:acp:conformance

      - name: Upload ACP conformance reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acp-conformance
          path: |
            mastracode/sdk/node_modules/.acp-conformance/report/
            mastracode/sdk/node_modules/.acp-conformance/schema-source.json
          include-hidden-files: true
          retention-days: 14

      - name: Run Mastra Code E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter ./mastracode/tui run e2e:test -- --reporter=dot

  mastracode-web-e2e:
    name: Mastra Code web host OM scenarios
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN == '' && 'local:rw' || 'remote:rw' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup pnpm and Node.js
        uses: $/.github/actions/setup-pnpm-node

      - name: Cache turbo build setup
        if: ${{ env.TURBO_TOKEN == '' }}
        uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `mastracode/web` is a separate pnpm project; its scenario tests resolve
      # workspace packages from their built `dist`.
      - name: Install web host dependencies
        run: pnpm --dir mastracode/web install --frozen-lockfile

      - name: Build web host dependencies
        run: pnpm --dir mastracode/web run prebuild

      - name: Run web host OM scenarios
        run: >-
          pnpm --dir mastracode/web exec vitest run --project e2e:mastracode-web
          e2e/web/om-config.scenario.test.ts
          e2e/web/om-record.scenario.test.ts
          --reporter=dot
